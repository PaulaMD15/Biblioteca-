
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libros</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<nav class="sidebar">
    <div class="logo">📚 Biblioteca</div>
    <a th:href="@{/}">🏠 Inicio</a>
    <a th:href="@{/libros}" class="active">📖 Libros</a>
    <a th:href="@{/estudiantes}">👥 Estudiantes</a>
    <a th:href="@{/prestamos}">🔄 Préstamos</a>
</nav>

<main class="main">
    <header class="topbar">
        <h2>Gestión de libros</h2>
    </header>

    <section class="panel">
        <h2>Registrar nuevo libro</h2>

        <form th:action="@{/libros/guardar}"
              th:object="${libro}" method="post">

            <div class="form-group">
                <label>Título</label>
                <input type="text" th:field="*{titulo}" required>
            </div>

            <div class="form-group">
                <label>Autor</label>
                <input type="text" th:field="*{autor}" required>
            </div>

            <div class="form-group">
                <label>Editorial</label>
                <input type="text" th:field="*{editorial}">
            </div>

            <div class="form-group">
                <label>ISBN</label>
                <input type="text" th:field="*{isbn}">
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" th:field="*{cantidad}" min="1" required>
            </div>

            <button class="btn" type="submit">Guardar libro</button>
        </form>
    </section>

    <section class="panel">
        <h2>Libros registrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Editorial</th>
                    <th>Cantidad</th>
                    <th>Disponibles</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="libro : ${libros}">
                    <td th:text="${libro.titulo}"></td>
                    <td th:text="${libro.autor}"></td>
                    <td th:text="${libro.editorial}"></td>
                    <td th:text="${libro.cantidad}"></td>
                    <td th:text="${libro.disponibles}"></td>
                </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
