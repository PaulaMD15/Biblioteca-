
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudiantes</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<nav class="sidebar">
    <div class="logo">📚 Biblioteca</div>
    <a th:href="@{/}">🏠 Inicio</a>
    <a th:href="@{/libros}">📖 Libros</a>
    <a th:href="@{/estudiantes}" class="active">👥 Estudiantes</a>
    <a th:href="@{/prestamos}">🔄 Préstamos</a>
</nav>

<main class="main">
    <header class="topbar">
        <h2>Gestión de estudiantes</h2>
    </header>

    <section class="panel">
        <h2>Registrar estudiante</h2>

        <form th:action="@{/estudiantes/guardar}"
              th:object="${estudiante}" method="post">

            <div class="form-group">
                <label>Documento</label>
                <input type="text" th:field="*{documento}" required>
            </div>

            <div class="form-group">
                <label>Nombres</label>
                <input type="text" th:field="*{nombres}" required>
            </div>

            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" th:field="*{apellidos}" required>
            </div>

            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" th:field="*{correo}">
            </div>

            <div class="form-group">
                <label>Programa académico</label>
                <input type="text" th:field="*{programa}">
            </div>

            <button class="btn" type="submit">Guardar estudiante</button>
        </form>
    </section>

    <section class="panel">
        <h2>Estudiantes registrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Documento</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Correo</th>
                    <th>Programa</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="estudiante : ${estudiantes}">
                    <td th:text="${estudiante.documento}"></td>
                    <td th:text="${estudiante.nombres}"></td>
                    <td th:text="${estudiante.apellidos}"></td>
                    <td th:text="${estudiante.correo}"></td>
                    <td th:text="${estudiante.programa}"></td>
                </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
